[project]
name = "cachetout"
version = "0.1.0"
description = "A persistent, type-safe caching library for Python"
readme = "README.md"
authors = [
    { name = "Thomas Leese", email = "thomas@leese.io" }
]
requires-python = ">=3.14"
dependencies = [
    "msgspec>=0.21.1",
    "platformdirs>=4.11.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]
